name: Deploy DataCraft Website

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: datacraft-website
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  WEBSITE_IMAGE: ghcr.io/davids3gura/datacraft-website

jobs:
  build-and-push:
    name: Build and publish image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push website
        id: docker_build_website
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.WEBSITE_IMAGE }}:production
            ${{ env.WEBSITE_IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=production
          cache-from: type=gha,scope=website
          cache-to: type=gha,mode=max,scope=website

      - name: Print image digest
        run: echo "Website digest: ${{ steps.docker_build_website.outputs.digest }}"

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Pull image and deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          command_timeout: 10m
          script: |
            set -Eeuo pipefail

            cd /opt/datacraft/apps/website

            echo "Actualizando configuración desde GitHub..."
            git fetch origin
            git reset --hard ${{ github.sha }}
            echo "Commit desplegado: $(git rev-parse HEAD)"

            IMAGE="ghcr.io/davids3gura/datacraft-website"
            IMAGE_TAG="${{ github.sha }}"
            LOCAL_IMAGE="datacraft-website"

            echo "Descargando imagen exacta del commit..."
            docker pull "${IMAGE}:${IMAGE_TAG}"

            echo "Verificando revisión de la imagen..."
            REV=$(
              docker image inspect \
                --format='{{ index .Config.Labels "org.opencontainers.image.revision" }}' \
                "${IMAGE}:${IMAGE_TAG}"
            )
            if [ "${REV}" != "${IMAGE_TAG}" ]; then
              echo "ERROR: image revision mismatch (${REV} != ${IMAGE_TAG})."
              exit 1
            fi
            echo "Imagen confirmada: ${REV}"

            echo "Etiquetando imagen como production local..."
            docker rmi "${LOCAL_IMAGE}:production" >/dev/null 2>&1 || true
            docker tag "${IMAGE}:${IMAGE_TAG}" "${LOCAL_IMAGE}:production"

            echo "Levantando DataCraft Website..."
            docker compose up -d --no-build --force-recreate --remove-orphans

            echo ""
            echo "Estado final"
            docker compose ps
            echo ""
            echo "Deploy completado correctamente."
